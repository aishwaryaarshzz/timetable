
<!DOCTYPE html>
<html>
<head>
    <title>Class Timetable</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: white;
        }

        h1 {
            color: blue;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: lightblue;
        }

        td {
            background-color: white;
        }
    </style>
</head>

<body>

    <h1>Class Timetable</h1>

    <table>

        <tr>
            <th>Day</th>
            <th>Time Slot</th>
            <th>Subject</th>
            <th>Faculty Name</th>
            <th>Classroom</th>
        </tr>

        {% for slot in records %}

        <tr>
            <td>{{ slot.day }}</td>

            <td>
                {{ slot.start_time }} - {{ slot.end_time }}
            </td>

            <td>{{ slot.subject_name }}</td>

            <td>{{ slot.faculty_name }}</td>

            <td>{{ slot.classroom }}</td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="5">No timetable records available</td>
        </tr>

        {% endfor %}

    </table>

</body>
</html>
